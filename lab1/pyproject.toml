[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr1-ames-housing"
version = "0.1.0"
description = "Лабораторная работа №1 по основам Data Science: Ames Housing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "notebook>=7.0",
    "ipykernel>=6.25",
]

[tool.setuptools]
py-modules = []
