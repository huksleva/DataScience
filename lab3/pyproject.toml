[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-trees-labs"
version = "1.0.0"
description = "Лабораторные работы по деревьям решений и ансамблевым методам машинного обучения"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter>=1.0",
    "notebook>=7.0",
    "joblib>=1.3"
]

[tool.setuptools]
py-modules = []